        hasImg: own && !!f[5], showText: !(own && f[5]), img: f[5], text: own ? initials(f[0]) : '?',

        count: f[4] > 1 ? '×' + f[4] : '', onDisplay: !!f[6],
        border: i === fig ? '#6B4EE6' : '#2B1F4A', current: i === fig ? 'true' : 'false',
        pick: () => this.setState({ fig: i })
      });
    });
    const f = col.figs[fig];
    const own = f[4] > 0;
    const d = {
      name: own ? f[0] : '???', rarity: f[1].toUpperCase(), rbg: RS[f[1]].bg, rfg: RS[f[1]].fg,
      hasImg: own && !!f[5], showText: !(own && f[5]), img: f[5], text: own ? initials(f[0]) : '?',
      well: own ? col.wash : '#EDE8F5', fg: own ? col.color : '#8C83A3',
      rate: f[2] + ' coins/s', owned: own ? '×' + f[4] : 'None yet', chance: ((f[3] / total) * 100).toFixed(1) + '%',
      canDisplay: own && !f[6], isDisplayed: !!f[6], isMissing: !own,
      col: col.name
    };
    return { cols, filters, cards, d };
  }
}
</script>
