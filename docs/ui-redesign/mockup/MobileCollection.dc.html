<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone Collection</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#4B32C3}a:hover{color:#2B1F4A}
</style>
</helmet>
<div style="width: 844px; height: 390px; position: relative; overflow: hidden; background: #3A2C5E; font-family: 'Nunito', sans-serif; color: #2B1F4A">
<div aria-hidden="true" style="position: absolute; left: 10px; top: 8px; display: flex; gap: 6px">
<div style="width: 40px; height: 40px; border-radius: 12px; background: rgba(255, 255, 255, 0.25)"></div>
<div style="width: 40px; height: 40px; border-radius: 12px; background: rgba(255, 255, 255, 0.25)"></div>
</div>

<section aria-label="Collection" style="position: absolute; left: 104px; top: 6px; width: 732px; height: 376px; background: #FFFDF9; border: 3px solid #2B1F4A; border-radius: 22px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden">
<div style="height: 56px; flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 0 8px 0 12px; border-bottom: 2px solid #ECE5F6">
<img src="/_blob/9c1a7ac2fc725a1e7e0e267a09accf10" alt="" style="width: 40px; height: 40px; object-fit: contain">
<h1 style="margin: 0; font-family: 'Fredoka', sans-serif; font-size: 22px; font-weight: 600">Tender Echoes</h1>
<span style="font-size: 13px; font-weight: 800; color: #5C5276; flex-grow: 1">8 / 13</span>
<div role="group" aria-label="Filter" style="display: flex; gap: 4px; padding: 3px; border-radius: 22px; background: #F6F2FC">
<button aria-pressed="true" style="height: 38px; padding: 0 12px; border-radius: 19px; background: #2B1F4A; border: none; font: inherit; font-size: 13px; font-weight: 800; color: #FFFFFF">All</button>
<button aria-pressed="false" style="height: 38px; padding: 0 12px; border-radius: 19px; background: transparent; border: none; font: inherit; font-size: 13px; font-weight: 800; color: #2B1F4A">Found</button>
<button aria-pressed="false" style="height: 38px; padding: 0 12px; border-radius: 19px; background: transparent; border: none; font: inherit; font-size: 13px; font-weight: 800; color: #2B1F4A">Missing</button>
</div>
<a href="MobileHud.dc.html" aria-label="Close Collection" style="width: 44px; height: 44px; border-radius: 22px; background: #2B1F4A; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15"></path></svg>
</a>
</div>

<div style="flex-grow: 1; display: grid; grid-template-columns: 72px minmax(0, 1fr) 250px; min-height: 0">
<div style="background: #F6F2FC; border-right: 2px solid #ECE5F6; padding: 8px; display: flex; flex-direction: column; gap: 6px; overflow-y: auto">
<button aria-label="Pocket Grove, 6 of 6" style="width: 52px; height: 52px; flex-shrink: 0; border-radius: 14px; background: #E4F1DA; border: 3px solid transparent; padding: 0; overflow: hidden; cursor: pointer"><img src="/_blob/c7e7dfe8275bb249474386d1cc28569a" alt="" style="width: 46px; height: 46px; object-fit: cover; mix-blend-mode: multiply"></button>
<button aria-label="Tidepool Tales, 4 of 6" style="width: 52px; height: 52px; flex-shrink: 0; border-radius: 14px; background: #DCEEF7; border: 3px solid transparent; font-family: 'Fredoka', sans-serif; font-size: 16px; font-weight: 700; color: #2F7FA6; cursor: pointer">TT</button>
<button aria-label="Concepts, 2 of 5" style="width: 52px; height: 52px; flex-shrink: 0; border-radius: 14px; background: #F7E1EA; border: 3px solid transparent; padding: 0; overflow: hidden; cursor: pointer"><img src="/_blob/8ccface322384c38b64f84acfb586c92" alt="" style="width: 46px; height: 46px; object-fit: cover; mix-blend-mode: multiply"></button>
<button aria-label="Tender Echoes, 8 of 13" aria-pressed="true" style="width: 52px; height: 52px; flex-shrink: 0; border-radius: 14px; background: #FCEADB; border: 3px solid #6B4EE6; padding: 0; overflow: hidden; cursor: pointer"><img src="/_blob/181aa3c2353cb21bd94991065595cbdb" alt="" style="width: 46px; height: 46px; object-fit: cover; mix-blend-mode: multiply"></button>
<button aria-label="We Are All Stars, 0 of 13" style="width: 52px; height: 52px; flex-shrink: 0; border-radius: 14px; background: #E1E5F8; border: 3px solid transparent; font-family: 'Fredoka', sans-serif; font-size: 16px; font-weight: 700; color: #4A5BB8; cursor: pointer">WS</button>
</div>

<div style="overflow-y: auto; padding: 10px; min-height: 0">
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{cards}}" as="k" hint-placeholder-count="9">
<button aria-pressed="{{k.current}}" style="height: 108px; padding: 0; display: flex; flex-direction: column; border-radius: 14px; background: #FFFFFF; border: 3px solid {{k.border}}; overflow: hidden; font: inherit; color: #2B1F4A; cursor: pointer; text-align: left; position: relative; box-sizing: border-box">
<span style="height: 72px; width: 100%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: {{k.well}}; border-bottom: 4px solid {{k.rbg}}; font-family: 'Fredoka', sans-serif; font-size: 26px; font-weight: 700; color: #8C83A3; overflow: hidden">
<sc-if value="{{k.own}}" hint-placeholder-val="{{true}}"><img src="{{k.img}}" alt="" style="width: 72px; height: 72px; object-fit: contain; mix-blend-mode: multiply"></sc-if>
<sc-if value="{{k.missing}}" hint-placeholder-val="{{false}}">?</sc-if>
</span>
<span style="padding: 3px 7px 0; font-size: 12px; font-weight: 800; line-height: 1.2">{{k.name}}</span>
<sc-if value="{{k.count}}" hint-placeholder-val="{{false}}"><span style="position: absolute; top: 4px; right: 4px; height: 20px; padding: 0 6px; display: flex; align-items: center; border-radius: 10px; background: #2B1F4A; color: #FFFFFF; font-size: 11px; font-weight: 900">{{k.count}}</span></sc-if>
</button>
</sc-for>
</div>
</div>

<div style="border-left: 2px solid #ECE5F6; padding: 10px 12px; display: flex; flex-direction: column; gap: 7px">
<div style="height: 84px; flex-shrink: 0; border-radius: 14px; background: #FCEADB; border-bottom: 5px solid #B9DECC; display: flex; align-items: center; justify-content: center; overflow: hidden">
<img src="/_blob/505e8ae450947202a2b2a5007eca8a39" alt="Thread Parade" style="width: 84px; height: 84px; object-fit: contain; mix-blend-mode: multiply">
</div>
<div style="display: flex; align-items: center; gap: 8px">
<h2 style="margin: 0; font-family: 'Fredoka', sans-serif; font-size: 19px; font-weight: 600; flex-grow: 1">Thread Parade</h2>
<span style="height: 22px; display: flex; align-items: center; padding: 0 8px; border-radius: 11px; background: #B9DECC; color: #274D3A; font-size: 11px; font-weight: 900">COMMON</span>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 5px; font-size: 11px; font-weight: 800; color: #5C5276">
<span style="display: flex; flex-direction: column; padding: 4px 7px; border-radius: 10px; background: #F6F2FC">Earns<span style="font-family: 'Fredoka', sans-serif; font-size: 15px; font-weight: 600; color: #1E6B47">1/s</span></span>
<span style="display: flex; flex-direction: column; padding: 4px 7px; border-radius: 10px; background: #F6F2FC">Own<span style="font-family: 'Fredoka', sans-serif; font-size: 15px; font-weight: 600; color: #2B1F4A">×3</span></span>
<span style="display: flex; flex-direction: column; padding: 4px 7px; border-radius: 10px; background: #F6F2FC">Chance<span style="font-family: 'Fredoka', sans-serif; font-size: 15px; font-weight: 600; color: #2B1F4A">11.6%</span></span>
</div>
<button style="height: 48px; flex-shrink: 0; border-radius: 15px; background: #6B4EE6; border: 3px solid #2B1F4A; box-shadow: 0 3px 0 #2B1F4A; color: #FFFFFF; font-family: 'Fredoka', sans-serif; font-size: 18px; font-weight: 600; cursor: pointer">Put on Display</button>
</div>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":844,"height":390}}'>
const TE = [
  ['Thread Parade', 'Common', 3, '/_blob/505e8ae450947202a2b2a5007eca8a39'],
  ['Wander Knit', 'Common', 1, '/_blob/44343135f06c2e37975a1600c113e79a'],
  ['Dino Drift', 'Common', 2, '/_blob/a6143754a82ce134b1f00beffeaaff1d'],
  ['Still Pebble', 'Common', 0, ''],
  ['Hearth Helm', 'Uncommon', 1, '/_blob/abce08ed4d5633e1c5892467c075f73d'],
  ['Echo Line', 'Uncommon', 0, ''],
  ['Paper Crown', 'Uncommon', 1, '/_blob/7c8986ccf31fc3a99f909eec3e8d87ee'],
  ['Mask Nuzzle', 'Rare', 1, '/_blob/5c8bd2b2b4094b4e0b2a1db381408e19'],
  ['Hush Veil', 'Rare', 0, ''],
  ['Crate Spark', 'Rare', 1, '/_blob/07b8f8d111ef6eb718a69dc0b552a107'],
  ['Feather Hush', 'Legendary', 0, ''],
  ['Mumble Beast', 'Legendary', 0, ''],
  ['Moon Doze', 'Mythical', 1, '/_blob/88cf2e1b1ed896943f96c2d8cfcc5403']
];
const RB = { Common: '#B9DECC', Uncommon: '#CDBDE6', Rare: '#E7B656', Legendary: '#A9374C', Mythical: '#A44DB4' };
class Component extends DCLogic {
  renderVals() {
    const cards = TE.map((f, i) => ({
      name: f[2] ? f[0] : '???', own: !!f[2], missing: !f[2], img: f[3],
      well: f[2] ? '#FCEADB' : '#EDE8F5', rbg: RB[f[1]],
      count: f[2] > 1 ? '×' + f[2] : '',
      border: i === 0 ? '#6B4EE6' : '#2B1F4A', current: i === 0 ? 'true' : 'false'
    }));
    return { cards };
  }
}
</script>
</body>
</html>
