<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone Shop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#4B32C3}a:hover{color:#2B1F4A}
</style>
</helmet>
<div style="width: 844px; height: 390px; position: relative; overflow: hidden; background: #3A2C5E; font-family: 'Nunito', sans-serif; color: #2B1F4A">
<div aria-hidden="true" style="position: absolute; left: 10px; top: 8px; display: flex; gap: 6px">
<div style="width: 40px; height: 40px; border-radius: 12px; background: rgba(255, 255, 255, 0.25)"></div>
<div style="width: 40px; height: 40px; border-radius: 12px; background: rgba(255, 255, 255, 0.25)"></div>
</div>

<section aria-label="Shop" style="position: absolute; left: 104px; top: 6px; width: 732px; height: 376px; background: #FFFDF9; border: 3px solid #2B1F4A; border-radius: 22px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden">
<div style="height: 56px; flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 0 8px 0 12px; border-bottom: 2px solid #ECE5F6">
<img src="/_blob/9ec00bb0642de8485a672e499d08477b" alt="" style="width: 40px; height: 40px; object-fit: contain">
<h1 style="margin: 0; font-family: 'Fredoka', sans-serif; font-size: 24px; font-weight: 600; flex-grow: 1">Shop</h1>
<span aria-label="12,480 coins" style="height: 40px; display: flex; align-items: center; gap: 6px; padding: 0 12px 0 8px; border-radius: 20px; background: #FFF6DA; font-family: 'Fredoka', sans-serif; font-size: 18px; font-weight: 600">
<svg width="22" height="22" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="12" fill="#FFC83D" stroke="#2B1F4A" stroke-width="2.5"></circle><circle cx="14" cy="14" r="6.5" fill="none" stroke="#C98A00" stroke-width="2.2"></circle></svg>12,480</span>
<a href="MobileHud.dc.html" aria-label="Close Shop" style="width: 44px; height: 44px; border-radius: 22px; background: #2B1F4A; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15"></path></svg>
</a>
</div>

<div style="flex-grow: 1; display: grid; grid-template-columns: 72px 264px minmax(0, 1fr); min-height: 0">
<div style="background: #F6F2FC; border-right: 2px solid #ECE5F6; padding: 8px 8px; display: flex; flex-direction: column; gap: 6px; overflow-y: auto">
<button aria-label="Pocket Grove, 6 of 6" style="width: 52px; height: 52px; flex-shrink: 0; border-radius: 14px; background: #E4F1DA; border: 3px solid transparent; padding: 0; overflow: hidden; cursor: pointer"><img src="/_blob/c7e7dfe8275bb249474386d1cc28569a" alt="" style="width: 46px; height: 46px; object-fit: cover; mix-blend-mode: multiply"></button>
<button aria-label="Tidepool Tales, 4 of 6" style="width: 52px; height: 52px; flex-shrink: 0; border-radius: 14px; background: #DCEEF7; border: 3px solid transparent; font-family: 'Fredoka', sans-serif; font-size: 16px; font-weight: 700; color: #2F7FA6; cursor: pointer">TT</button>
<button aria-label="Concepts, 2 of 5" style="width: 52px; height: 52px; flex-shrink: 0; border-radius: 14px; background: #F7E1EA; border: 3px solid transparent; padding: 0; overflow: hidden; cursor: pointer"><img src="/_blob/8ccface322384c38b64f84acfb586c92" alt="" style="width: 46px; height: 46px; object-fit: cover; mix-blend-mode: multiply"></button>
<button aria-label="Tender Echoes, 8 of 13" aria-pressed="true" style="width: 52px; height: 52px; flex-shrink: 0; border-radius: 14px; background: #FCEADB; border: 3px solid #6B4EE6; padding: 0; overflow: hidden; cursor: pointer"><img src="/_blob/181aa3c2353cb21bd94991065595cbdb" alt="" style="width: 46px; height: 46px; object-fit: cover; mix-blend-mode: multiply"></button>
<button aria-label="We Are All Stars, 0 of 13" style="width: 52px; height: 52px; flex-shrink: 0; border-radius: 14px; background: #E1E5F8; border: 3px solid transparent; font-family: 'Fredoka', sans-serif; font-size: 16px; font-weight: 700; color: #4A5BB8; cursor: pointer">WS</button>
</div>

<div style="padding: 10px 14px; display: flex; flex-direction: column; gap: 8px; border-right: 2px solid #ECE5F6">
<div style="display: flex; align-items: center; gap: 12px">
<div style="width: 92px; height: 92px; flex-shrink: 0; position: relative; border: 3px solid #2B1F4A; border-radius: 20px; background: #FCEADB; overflow: hidden; display: flex; align-items: center; justify-content: center; box-sizing: border-box">
<div style="position: absolute; left: 0; top: 0; width: 100%; height: 22px; background: #C46A2C; border-bottom: 3px solid #2B1F4A"></div>
<span style="position: relative; margin-top: 16px; width: 46px; height: 46px; border-radius: 23px; background: #FFFFFF; border: 2px solid #2B1F4A; display: flex; align-items: center; justify-content: center; font-family: 'Fredoka', sans-serif; font-size: 28px; font-weight: 700; color: #C46A2C">?</span>
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<h2 style="margin: 0; font-family: 'Fredoka', sans-serif; font-size: 20px; font-weight: 600; line-height: 1.15">Tender Echoes box</h2>
<span style="font-size: 13px; font-weight: 700; color: #5C5276">8 of 13 found</span>
<span style="font-size: 13px; font-weight: 700; color: #5C5276">5 left to discover</span>
</div>
</div>
<button style="height: 54px; display: flex; align-items: center; justify-content: center; gap: 10px; background: #FFC83D; border: 3px solid #2B1F4A; border-radius: 16px; box-shadow: 0 4px 0 #2B1F4A; font-family: 'Fredoka', sans-serif; font-size: 20px; font-weight: 600; color: #2B1F4A; cursor: pointer">Open 1 box
<span style="display: flex; align-items: center; gap: 4px; height: 30px; padding: 0 8px; border-radius: 10px; background: #FFFFFF; border: 2px solid #2B1F4A; font-size: 17px">
<svg width="18" height="18" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="12" fill="#FFC83D" stroke="#2B1F4A" stroke-width="2.5"></circle><circle cx="14" cy="14" r="6.5" fill="none" stroke="#C98A00" stroke-width="2.2"></circle></svg>150</span>
</button>
<button style="height: 46px; display: flex; align-items: center; justify-content: center; background: #DDF3E6; border: 3px solid #2B1F4A; border-radius: 16px; font-family: 'Fredoka', sans-serif; font-size: 17px; font-weight: 600; color: #174F36; cursor: pointer">Claim today's free box</button>
</div>

<div style="padding: 10px 14px; display: flex; flex-direction: column; gap: 8px; min-height: 0; overflow-y: auto">
<h3 style="margin: 0; font-family: 'Fredoka', sans-serif; font-size: 17px; font-weight: 600">What's inside</h3>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px">
<sc-for list="{{tiles}}" as="t" hint-placeholder-count="13">
<div title="{{t.name}}" style="height: 40px; border-radius: 10px; background: {{t.bg}}; border-bottom: 4px solid {{t.rbg}}; display: flex; align-items: center; justify-content: center; overflow: hidden; font-family: 'Fredoka', sans-serif; font-size: 15px; font-weight: 700; color: #6A6080">
<sc-if value="{{t.own}}" hint-placeholder-val="{{true}}"><img src="{{t.img}}" alt="{{t.name}}" style="width: 40px; height: 40px; object-fit: cover; mix-blend-mode: multiply"></sc-if>
<sc-if value="{{t.missing}}" hint-placeholder-val="{{false}}">?</sc-if>
</div>
</sc-for>
</div>
<h3 style="margin: 4px 0 0; font-family: 'Fredoka', sans-serif; font-size: 17px; font-weight: 600">Drop odds</h3>
<div style="height: 14px; display: flex; border-radius: 7px; overflow: hidden; border: 2px solid #2B1F4A; flex-shrink: 0">
<div style="height: 100%; width: 46.2%; background: #B9DECC"></div>
<div style="height: 100%; width: 26%; background: #CDBDE6"></div>
<div style="height: 100%; width: 17.3%; background: #E7B656"></div>
<div style="height: 100%; width: 9.2%; background: #A9374C"></div>
<div style="height: 100%; width: 1.3%; background: #A44DB4"></div>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 14px; font-size: 13px; font-weight: 800">
<span style="display: flex; justify-content: space-between"><span>Common</span><span>46.2%</span></span>
<span style="display: flex; justify-content: space-between"><span>Uncommon</span><span>26.0%</span></span>
<span style="display: flex; justify-content: space-between"><span>Rare</span><span>17.3%</span></span>
<span style="display: flex; justify-content: space-between"><span>Legendary</span><span>9.2%</span></span>
<span style="display: flex; justify-content: space-between"><span>Mythical</span><span>1.2%</span></span>
</div>
</div>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":844,"height":390}}'>
const TE = [
  ['Thread Parade', 'Common', 1, '/_blob/505e8ae450947202a2b2a5007eca8a39'],
  ['Wander Knit', 'Common', 1, '/_blob/44343135f06c2e37975a1600c113e79a'],
  ['Dino Drift', 'Common', 1, '/_blob/a6143754a82ce134b1f00beffeaaff1d'],
  ['Still Pebble', 'Common', 0, ''],
  ['Hearth Helm', 'Uncommon', 1, '/_blob/abce08ed4d5633e1c5892467c075f73d'],
  ['Echo Line', 'Uncommon', 0, ''],
  ['Paper Crown', 'Uncommon', 1, '/_blob/7c8986ccf31fc3a99f909eec3e8d87ee'],
  ['Mask Nuzzle', 'Rare', 1, '/_blob/5c8bd2b2b4094b4e0b2a1db381408e19'],
  ['Hush Veil', 'Rare', 0, ''],
  ['Crate Spark', 'Rare', 1, '/_blob/07b8f8d111ef6eb718a69dc0b552a107'],
  ['Feather Hush', 'Legendary', 0, ''],
  ['Mumble Beast', 'Legendary', 0, ''],
  ['Moon Doze', 'Mythical', 1, '/_blob/88cf2e1b1ed896943f96c2d8cfcc5403']
];
const RB = { Common: '#B9DECC', Uncommon: '#CDBDE6', Rare: '#E7B656', Legendary: '#A9374C', Mythical: '#A44DB4' };
class Component extends DCLogic {
  renderVals() {
    const tiles = TE.map((f) => ({
      name: f[2] ? f[0] : 'Not found yet', own: !!f[2], missing: !f[2], img: f[3],
      bg: f[2] ? '#FCEADB' : '#EDE8F5', rbg: RB[f[1]]
    }));
    return { tiles };
  }
}
</script>
</body>
</html>
