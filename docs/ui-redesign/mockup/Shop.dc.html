<div style="display: flex; align-items: baseline; justify-content: space-between; margin-top: 4px">

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
const RS = {
  Common: { bg: '#B9DECC' },
  Uncommon: { bg: '#CDBDE6' },
  Rare: { bg: '#E7B656' },
  Legendary: { bg: '#A9374C' },
  Mythical: { bg: '#A44DB4' }
};
const ORDER = ['Common', 'Uncommon', 'Rare', 'Legendary', 'Mythical'];
const COLS = [
  { name: 'Pocket Grove', color: '#4F8A3F', wash: '#E4F1DA', icon: '/_blob/c7e7dfe8275bb249474386d1cc28569a', mono: 'PG', figs: [
    ['Pebble Pip', 'Common', 20, 2, '/_blob/e0b6f4069400f5913936f2c3dceb5938'],
    ['Sprout Scout', 'Common', 20, 1, '/_blob/c7e7dfe8275bb249474386d1cc28569a'],
    ['Acorn Dot', 'Common', 20, 1, '/_blob/1fa3c9a9173b0080eadd1954f54f5d03'],
    ['Mallow Cap', 'Uncommon', 15, 1, '/_blob/84735026d0940d80dfaaffe2b44ae905'],
    ['Moon Moth', 'Uncommon', 15, 2, '/_blob/cddbb280f0771b030531fcf8182780fb'],
    ['Sunbeam Sprite', 'Rare', 10, 1, '/_blob/ee8ea0a3d4b825245ff52b7f3ae494b8']
  ] },
  { name: 'Tidepool Tales', color: '#2F7FA6', wash: '#DCEEF7', icon: '', mono: 'TT', figs: [
    ['Bubble Bean', 'Common', 20, 1, ''], ['Coral Cuddle', 'Common', 20, 2, ''], ['Shell Scribe', 'Common', 20, 1, ''],
    ['Jelly Jive', 'Uncommon', 15, 1, ''], ['Ripple Ray', 'Uncommon', 15, 0, ''], ['Pearl Regent', 'Rare', 10, 0, '']
  ] },
  { name: 'Concepts', color: '#A84C70', wash: '#F7E1EA', icon: '/_blob/8ccface322384c38b64f84acfb586c92', mono: 'C', figs: [
    ['Verity', 'Common', 20, 1, '/_blob/8ccface322384c38b64f84acfb586c92'], ['Falsity', 'Uncommon', 15, 0, ''],
    ['Cruelty', 'Rare', 10, 0, ''], ['Lovity', 'Legendary', 8, 1, '/_blob/6b41a9caf327c2a8f1039ec174b3ffae'],
    ['Verity True Form', 'Mythical', 3, 0, '']
  ] },
  { name: 'Tender Echoes', color: '#C46A2C', wash: '#FCEADB', icon: '/_blob/181aa3c2353cb21bd94991065595cbdb', mono: 'TE', figs: [
    ['Thread Parade', 'Common', 20, 3, '/_blob/505e8ae450947202a2b2a5007eca8a39'],
    ['Wander Knit', 'Common', 20, 1, '/_blob/44343135f06c2e37975a1600c113e79a'],
    ['Dino Drift', 'Common', 20, 2, '/_blob/a6143754a82ce134b1f00beffeaaff1d'],
    ['Still Pebble', 'Common', 20, 0, '/_blob/3d803025e1d0cd2a9b4800bcb5906201'],
    ['Hearth Helm', 'Uncommon', 15, 1, '/_blob/abce08ed4d5633e1c5892467c075f73d'],
    ['Echo Line', 'Uncommon', 15, 0, '/_blob/ca1792653ed3b2f9f582ea7ebea0aa96'],
    ['Paper Crown', 'Uncommon', 15, 1, '/_blob/7c8986ccf31fc3a99f909eec3e8d87ee'],
    ['Mask Nuzzle', 'Rare', 10, 1, '/_blob/5c8bd2b2b4094b4e0b2a1db381408e19'],
    ['Hush Veil', 'Rare', 10, 0, '/_blob/41e8c938c2de615632f91e77e315576b'],
    ['Crate Spark', 'Rare', 10, 1, '/_blob/07b8f8d111ef6eb718a69dc0b552a107'],
    ['Feather Hush', 'Legendary', 8, 0, '/_blob/d8168813d27b67585b0bda349a877444'],
    ['Mumble Beast', 'Legendary', 8, 0, '/_blob/ae5a5689ce962fc82e2c697ec0e68db0'],
    ['Moon Doze', 'Mythical', 2, 1, '/_blob/88cf2e1b1ed896943f96c2d8cfcc5403']
  ] },
  { name: 'We Are All Stars', color: '#4A5BB8', wash: '#E1E5F8', icon: '', mono: 'WS', figs: [
    ['Reminiscence Star', 'Common', 20, 0, ''], ['Mirrorlight Star', 'Common', 20, 0, ''], ['Wishing Star', 'Common', 20, 0, ''],
    ['Page Turner Star', 'Common', 20, 0, ''], ['Nightlight Star', 'Uncommon', 15, 0, ''], ['Lamplight Star', 'Uncommon', 15, 0, ''],
    ['Garden Star', 'Uncommon', 15, 0, ''], ['Sanctuary Star', 'Rare', 10, 0, ''], ['Echo Star', 'Rare', 10, 0, ''],
    ['Radiant Star', 'Rare', 10, 0, ''], ['Cloud Rest Star', 'Legendary', 8, 0, ''], ['Meteor Shower Star', 'Legendary', 8, 0, ''],
    ['Dreamcatcher Star', 'Mythical', 2, 0, '']
  ] }
];
class Component extends DCLogic {
  renderVals() {
    const sel = this.state && this.state.sel != null ? this.state.sel : 3;
    const col = COLS[sel];
    const cols = COLS.map((c, i) => {
      const found = c.figs.filter((f) => f[3] > 0).length;
      return {
        name: c.name, color: c.color, wash: c.wash, icon: c.icon, mono: c.mono,
        hasIcon: !!c.icon, noIcon: !c.icon,
        label: found + '/' + c.figs.length,
        pct: Math.round((found / c.figs.length) * 100) + '%',
        bg: i === sel ? '#FFFFFF' : 'transparent',
        border: i === sel ? '#6B4EE6' : 'transparent',
        current: i === sel ? 'true' : 'false',
        pick: () => this.setState({ sel: i })
      };
    });
    const found = col.figs.filter((f) => f[3] > 0).length;
    const left = col.figs.length - found;
    const total = col.figs.reduce((s, f) => s + f[2], 0);
    const tiles = col.figs.map((f) => {
      const own = f[3] > 0;
      const initials = f[0].split(' ').map((w) => w[0]).join('').slice(0, 2);
      return {
        name: own ? f[0] : 'Not found yet',
        hasImg: own && !!f[4], showText: !(own && f[4]),
        img: f[4], text: own ? initials : '?',
        bg: own ? col.wash : '#EDE8F5', fg: own ? col.color : '#6A6080',
        rbg: RS[f[1]].bg
      };
    });
    const odds = ORDER.filter((r) => col.figs.some((f) => f[1] === r)).map((r) => {
      const fs = col.figs.filter((f) => f[1] === r);
      const p = (fs.reduce((s, f) => s + f[2], 0) / total) * 100;
      return { name: r, bg: RS[r].bg, width: p + '%', pct: p.toFixed(1) + '%', count: fs.length === 1 ? '1 figure' : fs.length + ' figures, ' + (p / fs.length).toFixed(1) + '% each' };
    });
    return {
      cols, tiles, odds,
      col: {
        name: col.name, color: col.color, wash: col.wash, count: col.figs.length,
        progress: left === 0 ? 'Complete! Every figure found' : found + ' of ' + col.figs.length + ' found · ' + left + ' left to discover'
      }
    };
  }
}
</script>
